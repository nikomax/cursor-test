name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: /${{ github.event.repository.name }}/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Publish deployment URL
        run: |
          {
            echo "## Live preview"
            echo ""
            echo "Open this URL after enabling Pages in repo settings:"
            echo ""
            echo "**https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/**"
            echo ""
            echo "> Do not use \`https://${{ github.repository_owner }}.github.io/\` — that is a different project."
            echo ""
            echo "### One-time setup"
            echo "1. Go to **Settings → Pages**"
            echo "2. Set **Source** to **Deploy from a branch**"
            echo "3. Choose branch \`gh-pages\` and folder \`/(root)\`"
            echo "4. Save, then wait ~1 minute for the site to appear"
          } >> "$GITHUB_STEP_SUMMARY"
